name: ci
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure -R '^(beam3d|dynamics|element_response|beam_loads|partial_beam_loads|time_element_loads|beam_section_forces|beam_force_output|section_stress|result_recorders)$'
